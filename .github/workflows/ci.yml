# ci.yml - Continuous Integration: automatic checks on every change.
#
# Runs on every pull request, and on every push to main. If any job fails,
# GitHub shows a red cross, and (once you enable branch protection - see
# README Step 8) the pull request can't be merged. This is the first safety
# gate between your laptop and staging/prod.
#
# In Phase 6 we'll add deploy.yml, which runs AFTER this succeeds on main:
# deploy to staging automatically, then to production after your approval.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# If you push again while a run is in progress, cancel the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A real MongoDB for the tests, started fresh for every run.
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_URI: mongodb://localhost:27017

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip   # reuse downloaded packages between runs (faster)
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests (pytest)
        run: pytest -v

  frontend:
    name: Frontend - type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # `npm ci` installs EXACTLY what's in package-lock.json - reproducible.
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        # Placeholder values: this only proves the app compiles. Real
        # per-environment values are supplied by the deploy workflow later.
        env:
          VITE_API_URL: https://api.example.com
          VITE_COGNITO_REGION: eu-west-2
          VITE_COGNITO_USER_POOL_ID: eu-west-2_placeholder
          VITE_COGNITO_CLIENT_ID: placeholder
          VITE_COGNITO_DOMAIN: https://placeholder.auth.eu-west-2.amazoncognito.com
        run: npm run build

  docker:
    name: Backend - Docker image builds
    runs-on: ubuntu-latest
    needs: backend   # only bother if the tests passed
    steps:
      - uses: actions/checkout@v7
      - name: Build image (not pushed anywhere yet)
        run: docker build -t mock-interview-backend:ci ./backend
