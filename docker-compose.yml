# docker-compose.yml - Runs your DEV environment with one command:
#     docker compose up --build
#
# It starts three containers:
#   - mongo:   MongoDB's "Atlas Local" image: MongoDB plus vector search
#              (Phase 5), with its data saved in Docker volumes
#   - backend: your FastAPI app, reloading automatically when you edit code
#   - worker:  takes jobs off the SQS queue, transcribes and scores answers
#
# The frontend runs separately with `npm run dev` (faster hot-reloading).

services:
  mongo:
    # The same database engine as MongoDB Atlas in the cloud, including the
    # search engine that powers vector search - but running on your laptop.
    # It has its own built-in health check, so we don't define one.
    image: mongodb/mongodb-atlas-local:8.0
    hostname: mongo
    ports:
      # 127.0.0.1 = only reachable from THIS computer, not the rest of the network
      - "127.0.0.1:27017:27017"
    volumes:
      # New volume names, so this starts with a fresh, empty database. The
      # old volume was written by MongoDB 8.3, and an older version (8.0)
      # can't safely open data files made by a newer one.
      - atlas-data:/data/db
      - atlas-config:/data/configdb

  backend:
    build: ./backend             # build the image from backend/Dockerfile
    env_file: ./backend/.env     # your dev settings
    environment:
      # Inside Docker's network, containers reach each other by service name,
      # so "mongo" here means "the mongo container above". This overrides
      # the localhost address in .env.
      # directConnection=true: Atlas Local runs as a one-member "replica set",
      # and this tells the driver to talk to that one member directly.
      MONGODB_URI: mongodb://mongo:27017/?directConnection=true
      # Makes auto-reload notice file changes on Windows and macOS.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Share your code folder with the container, so edits appear instantly
      # without rebuilding the image.
      - ./backend/app:/app/app
    # --reload restarts the server when code changes (development only!).
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      mongo:
        condition: service_healthy   # wait until MongoDB passes its health check

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker   # the worker's own recipe
    env_file: ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/?directConnection=true
    volumes:
      # Shares your code like the backend does. The worker doesn't reload by
      # itself, though: after editing worker code, run
      #   docker compose restart worker
      - ./backend/app:/app/app
      # Keeps the downloaded Whisper model, so it's only downloaded once.
      - whisper-models:/home/appuser/.cache/huggingface
    depends_on:
      mongo:
        condition: service_healthy
    # The worker has no ports: nothing connects TO it. It reaches out to
    # SQS, S3, MongoDB and Claude by itself.

volumes:
  atlas-data:
  atlas-config:
  whisper-models:
